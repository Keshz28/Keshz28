name: Generate Contribution Snake

on:
  schedule:
    # rebuild twice a day so the snake stays current
    - cron: "0 */12 * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # one file per line; query strings customise the colours
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF3B5C
            dist/snake-light.svg?color_snake=#FF3B5C&color_dots=#EBEDF0,#F4C2CC,#F08CA0,#E8506F,#FF3B5C

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
