<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150"
     role="img" aria-label="VR Campus Tour — final-year project, immersive VR walkthrough of HELP University on Meta Quest 3">
  <defs>
    <style>
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.9} }
      .p{ animation: pulse 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce){ .p{animation:none} }
    </style>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15111A"/><stop offset="0.55" stop-color="#0E1016"/><stop offset="1" stop-color="#0B0E13"/>
    </linearGradient>
    <linearGradient id="sac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3B5C"/><stop offset="1" stop-color="#FF3B5C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="878" height="148" rx="14" fill="url(#sbg)" stroke="#2A2130" stroke-width="1.5"/>
  <rect x="1" y="1" width="878" height="3" rx="1.5" fill="url(#sac)"/>

  <g transform="translate(44 46)">
    <rect x="0" y="6" width="58" height="34" rx="12" fill="none" stroke="#FF3B5C" stroke-width="2.2"/>
    <circle cx="17" cy="23" r="6" fill="#FF3B5C" fill-opacity="0.85"/>
    <circle cx="41" cy="23" r="6" fill="#FF3B5C" fill-opacity="0.85"/>
    <path d="M-7 16 L0 16 M58 16 L65 16" stroke="#FF3B5C" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <text x="140" y="52" font-family="'JetBrains Mono','DejaVu Sans Mono','Courier New',monospace" font-size="18" font-weight="700" fill="#F0F3F6">VR Campus Tour</text>
  <g class="p"><circle cx="292" cy="46" r="4.5" fill="#FF3B5C"/></g>
  <text x="305" y="51" font-family="'JetBrains Mono','DejaVu Sans Mono','Courier New',monospace" font-size="11.5" fill="#FF3B5C">IN DEVELOPMENT</text>

  <text x="140" y="80" font-family="'JetBrains Mono','DejaVu Sans Mono','Courier New',monospace" font-size="12.5" fill="#8B949E">Final-year project — an immersive VR walkthrough that lets prospective students</text>
  <text x="140" y="99" font-family="'JetBrains Mono','DejaVu Sans Mono','Courier New',monospace" font-size="12.5" fill="#8B949E">explore HELP University's campus and facilities in full 3D.</text>

  <g font-family="'JetBrains Mono','DejaVu Sans Mono','Courier New',monospace" font-size="10.5" fill="#8B949E">
    <rect x="140" y="112" width="56" height="21" rx="10.5" fill="#161B22" stroke="#2A313C"/><text x="168" y="126.5" text-anchor="middle">Unity</text>
    <rect x="203" y="112" width="98" height="21" rx="10.5" fill="#161B22" stroke="#2A313C"/><text x="252" y="126.5" text-anchor="middle">Meta Quest 3</text>
    <rect x="308" y="112" width="42" height="21" rx="10.5" fill="#161B22" stroke="#2A313C"/><text x="329" y="126.5" text-anchor="middle">XR</text>
    <rect x="357" y="112" width="46" height="21" rx="10.5" fill="#161B22" stroke="#2A313C"/><text x="380" y="126.5" text-anchor="middle">C#</text>
  </g>
</svg>